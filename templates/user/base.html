<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <!-- Toastr CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">

    <!-- jQuery (Required for Toastr) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Toastr JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}

    {% if request.user.is_authenticated %}
    <script>
        const userStatusSocket = new WebSocket(
            'ws://' + window.location.host + '/user-online-status/{{ request.user.id }}/'
        );

        userStatusSocket.onopen = function(e) {
            console.log('User status WebSocket connected');
        };

        userStatusSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            if(data.is_online){
                $("#userStatus").text('Online');
            }
            else{
                $("#userStatus").text('Offline');
            }
            
            console.log('User status update:', data);
        };

        userStatusSocket.onclose = function(e) {
            console.log('User status WebSocket disconnected');
        };

        window.addEventListener('beforeunload', function() {
            userStatusSocket.close();
        });
    </script>
    {% endif %}
</body>
</html>
